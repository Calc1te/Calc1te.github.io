limit_req_zone $binary_remote_addr zone=blog_engagement:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name blog.calciiite.icu;

    root /data/blog.calciiite.icu/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.calciiite.icu;

    ssl_certificate /etc/letsencrypt/live/blog.calciiite.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.calciiite.icu/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    root /data/blog.calciiite.icu/current;
    index index.html;

    access_log /data/logs/blog.calciiite.icu_access.log standard;
    error_log /data/logs/blog.calciiite.icu_error.log warn;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/engagement/ {
        limit_req zone=blog_engagement burst=10 nodelay;
        proxy_pass http://172.17.0.1:5006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
